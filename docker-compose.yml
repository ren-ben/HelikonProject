services:
  # ─── Database ───────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: clil-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - helikon
      - caddy-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: clil-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@helikonproject.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
      PGADMIN_CONFIG_SESSION_COOKIE_SAMESITE: '"Lax"'
    depends_on:
      - postgres
    networks:
      - helikon
      - caddy-net

  # ─── Backend (Spring Boot) ─────────────────────────────────
  spring-boot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clil-backend
    restart: unless-stopped
    # No host-port binding — only reachable via nginx on the helikon network
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      RAG_SERVICE_URL: http://rag-service:8000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://helikonproject.com}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      postgres:
        condition: service_healthy
      rag-service:
        condition: service_started
    networks:
      - helikon
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s # give the JVM time to boot

  rag-service:
    build:
      context: ./rag-service
    container_name: clil-rag
    restart: unless-stopped
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-llama3}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      CHROMADB_PATH: /data/chromadb
    volumes:
      - chromadb_data:/data/chromadb
    networks:
      - helikon
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: .
      dockerfile: clil-frontend/Dockerfile
    container_name: clil-frontend
    restart: unless-stopped
    depends_on:
      - spring-boot
    networks:
      - helikon

  caddy:
    image: caddy:2-alpine
    container_name: clil-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    networks:
      - helikon
      - caddy-net

# ─── Volumes ────────────────────────────────────────────────────
volumes:
  postgres_data:
  chromadb_data: # persists ChromaDB vectors across restarts
  caddy_data: # persists Caddy's automatic HTTPS certificates
  caddy_config:
    # persists Caddy configuration

    # ─── Networks ───────────────────────────────────────────────────
networks:
  helikon:
    driver: bridge
  caddy-net:
    external: true
    name: caddy-net
